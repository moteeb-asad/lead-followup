# Monthly update PRs for npm packages and GitHub Actions, into develop.
# Runs on the 28th (the last day every month has) at 09:00 UTC.
# Docs: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: cron
      cronjob: "0 9 28 * *"
    commit-message:
      prefix: chore
      include: scope # gives "chore(deps): ..." to match AGENTS.md
    groups:
      # One PR for all minor and patch updates. Majors get their own PR.
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: cron
      cronjob: "0 9 28 * *"
    commit-message:
      prefix: ci
